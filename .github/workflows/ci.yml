name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pytest
      - name: 경계 테스트 (대사·경고·신규 유형 등)
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: 화면 빌드 (타입 검사 포함)
        working-directory: frontend
        run: npm ci && npm run build
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드 + 헬스 체크
        run: |
          docker build --build-arg WITH_OCR=0 -t auditon:ci .
          docker run -d --name a -p 8000:8000 auditon:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && exit 0; sleep 2; done
          docker logs a; exit 1
